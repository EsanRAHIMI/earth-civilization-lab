name: Six-sector observed validation
# Report artifacts are consumed by the Pages deployment workflow.
on:
  push:
    branches: [main]
    paths:
      - 'src/six_sector_observed_hindcast.py'
      - 'src/six_sector_robustness.py'
      - 'src/science_data_audit.py'
      - 'src/sector_lagged_research.py'
      - 'src/physical_water_food_accounting.py'
      - 'src/scientific_release_gate_v2.py'
      - 'src/six_sector_conformal_coverage.py'
      - 'src/observed_grid_pipeline.py'
      - 'tests/test_six_sector_observed.py'
      - 'tests/test_science_data_and_lags.py'
      - 'tests/test_water_food_conservation.py'
      - '.github/workflows/six-sector-observed.yml'
      - 'web/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download observed World Bank panel
        run: python -m src.multisector
      - name: Verify immutable source snapshots, units, lineage and time coverage
        run: python -m src.science_data_audit
      - name: Observed country-disjoint hindcast
        run: python -m src.six_sector_observed_hindcast
      - name: Multi-split climate water food robustness
        run: python -m src.six_sector_robustness
      - name: Exploratory research - country and temporal blocked lagged sector folds
        run: python -m src.sector_lagged_research
      - name: Machine-readable scientific release gate - BLOCK by default
        run: python -m src.scientific_release_gate_v2
      - name: Country-disjoint uncertainty coverage
        run: python -m src.six_sector_conformal_coverage
      - name: Unit tests for source integrity, leak-free lags and observed benchmarks
        run: |
          python -m unittest discover -s tests -p test_six_sector_observed.py -v
          python -m unittest discover -s tests -p test_science_data_and_lags.py -v
          python -m unittest discover -s tests -p test_water_food_conservation.py -v
      - name: Prepare public dashboard model reports
        run: |
          mkdir -p web/model
          cp reports/six_sector_observed_holdout.json web/model/holdout.json
          cp reports/six_sector_conformal_coverage.json web/model/uncertainty.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observed-six-sector-validation
          path: |
            reports/six_sector_observed_holdout.json
            reports/six_sector_robustness.json
            reports/scientific_data_lineage.json
            reports/sector_lagged_research.json
            reports/scientific_release_gate.json
            data/multisector_manifest.json
            data/multisector_observations.csv
            data/multisector_raw/*.json
            reports/six_sector_conformal_coverage.json
          if-no-files-found: warn
