name: EarthLab strict physical calibration acceptance
on:
  workflow_run:
    workflows: ["EarthLab observed multi-sector evidence"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  strict_science:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download corresponding observed evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: multisector-worldbank-observations-and-coverage
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require observed stocks and independent historical skill
        run: python -m src.strict_physical_calibration_gate
