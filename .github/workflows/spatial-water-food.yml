name: Spatial water and food research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/spatial_water_crop_operator.py'
      - 'src/gpcp_spatial_precipitation.py'
      - 'src/faostat_crop_source.py'
      - 'src/country_aligned_wheat_rain_benchmark.py'
      - 'src/wheat_no_future_weather_audit.py'
      - 'tests/test_wheat_no_future_weather_audit.py'
      - 'tests/test_country_aligned_wheat_rain.py'
      - 'tests/test_faostat_crop_source.py'
      - 'tests/test_spatial_water_crop_operator.py'
      - 'tests/test_gpcp_spatial_precipitation.py'
      - '.github/workflows/spatial-water-food.yml'
permissions:
  contents: read
  actions: read
jobs:
  spatial_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific NetCDF and numeric readers
        run: python -m pip install numpy==2.2.6 netCDF4==1.7.2 shapely==2.1.2 pyproj==3.7.2
      - name: Verify physical water accounting and gridded climate units
        run: |
          python -m unittest discover -s tests -p test_spatial_water_crop_operator.py -v
          python -m unittest discover -s tests -p test_gpcp_spatial_precipitation.py -v
          python -m unittest discover -s tests -p test_faostat_crop_source.py -v
          python -m unittest discover -s tests -p test_country_aligned_wheat_rain.py -v
          python -m unittest discover -s tests -p test_wheat_no_future_weather_audit.py -v
      - name: Restore immutable, SHA-verifiable NOAA source archive after upstream 503
        uses: actions/download-artifact@v4
        with:
          name: actual-spatial-rainfall-provenance
          run-id: 38950921593
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .verified-reference-archive
      - name: Validate historical source bytes before use
        run: |
          mkdir -p data/independent_raw
          cp .verified-reference-archive/data/independent_raw/noaa_gpcp_v23_monthly.nc data/independent_raw/noaa_gpcp_v23_monthly.nc
          echo "d31c53ab8180a883bd01442212948c3db4372d481b94a90e69d3d86bb65d7f68  data/independent_raw/noaa_gpcp_v23_monthly.nc" | sha256sum -c -
      - name: Download genuine NOAA GPCP rainfall and aggregate audited rectangles
        run: python -m src.gpcp_spatial_precipitation
      - name: Acquire real FAOSTAT QCL wheat yield and harvested area with exact units
        run: python -m src.faostat_crop_source
      - name: Align genuine country polygons with satellite rain and FAOSTAT yields
        run: python -m src.country_aligned_wheat_rain_benchmark
      - name: Audit actual wheat harvest forecast issue-time and held-country future-year skill
        run: python -m src.wheat_no_future_weather_audit
      - name: Publish original gridded source and actual observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-spatial-rainfall-provenance
          retention-days: 60
          if-no-files-found: warn
          path: |
            data/independent_raw/noaa_gpcp_v23_monthly.nc
            reports/gpcp_spatial_precipitation.json
            reports/faostat_wheat_country_observations.json
            data/independent_raw/faostat_qcl_original.zip
            data/independent_raw/naturalearth_country_polygons_110m.geojson
            reports/country_aligned_wheat_rain_benchmark.json
            reports/country_wheat_no_future_weather_audit.json
