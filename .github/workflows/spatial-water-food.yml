name: Spatial water and food research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/spatial_water_crop_operator.py'
      - 'src/gpcp_spatial_precipitation.py'
      - 'tests/test_spatial_water_crop_operator.py'
      - 'tests/test_gpcp_spatial_precipitation.py'
      - '.github/workflows/spatial-water-food.yml'
permissions:
  contents: read
jobs:
  spatial_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific NetCDF and numeric readers
        run: python -m pip install numpy==2.2.6 netCDF4==1.7.2
      - name: Verify physical water accounting and gridded climate units
        run: |
          python -m unittest discover -s tests -p test_spatial_water_crop_operator.py -v
          python -m unittest discover -s tests -p test_gpcp_spatial_precipitation.py -v
      - name: Download genuine NOAA GPCP rainfall and aggregate audited rectangles
        run: python -m src.gpcp_spatial_precipitation
      - name: Publish original gridded source and actual observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-spatial-rainfall-provenance
          retention-days: 60
          if-no-files-found: warn
          path: |
            data/independent_raw/noaa_gpcp_v23_monthly.nc
            reports/gpcp_spatial_precipitation.json
