name: EarthLab observed multi-sector evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/multisector.py'
      - 'src/calibration_readiness.py'
      - 'src/historical_calibration.py'
      - 'src/cross_sector_relationships.py'
      - 'src/physical_validation_audit.py'
      - 'src/bitcoin_cross_model.py'
      - 'src/bitcoin_data.py'
      - 'src/bitcoin_primary_calibration.py'
      - 'src/independent_source_evidence.py'
      - 'src/independent_population_consistency.py'
      - 'src/gcp_independent_target_calibration.py'
      - 'src/operational_readiness.py'
      - 'src/millennium_claim_audit.py'
      - 'src/noaa_gcp_carbon_hindcast.py'
      - 'src/multibox_climate.py'
      - 'src/multibox_ensemble.py'
      - 'src/nasa_temperature_hindcast.py'
      - 'tests/test_multisector.py'
      - '.github/workflows/multisector.yml'
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All unit tests
        run: python -m unittest discover -s tests -v
      - name: Acquire ten observed indicators across six sectors
        run: python src/multisector.py
      - name: Assess calibration readiness from actual coverage
        run: python src/calibration_readiness.py
      - name: Calibrate historical energy-economy-GHG association and temporal holdout
        run: python src/historical_calibration.py
      - name: Backtest water food population and economy relationships
        run: python -m src.cross_sector_relationships
      - name: Audit thousand-year physical conservation
        run: python -m src.physical_validation_audit
      - name: Retrieve real Bitcoin series as separate global subsystem
        run: python src/bitcoin_data.py --timespan history
      - name: Build Bitcoin links for all six sectors and physical core
        run: python src/bitcoin_cross_model.py
      - name: Calibrate Bitcoin primary global covariates across all six sectors
        run: python -m src.bitcoin_primary_calibration
      - name: Retrieve independent Global Carbon Project source inventories
        run: python src/independent_source_evidence.py
      - name: Calculate independent cross-source demographic consistency
        continue-on-error: true
        run: python src/independent_population_consistency.py
      - name: Calibrate and validate GCP fossil CO2 as independently published target
        run: python -m src.gcp_independent_target_calibration
      - name: Fit physical atmospheric carbon response and test NOAA historical observations
        run: python src/noaa_gcp_carbon_hindcast.py
      - name: Calibrate two-layer temperature response and evaluate NASA historical holdout
        run: python -m src.nasa_temperature_hindcast
      - name: Run millennial multi-reservoir carbon and temperature sensitivity ensemble
        run: python -m src.multibox_ensemble
      - name: Fit separate ocean and land net sink responses to GCB flux estimates
        run: python -m src.gcb_separate_sink_calibration
      - name: Audit reservoir identifiability and millennial uncertainty
        run: python -m src.reservoir_calibration_audit
      - name: Audit finite-horizon empirical coverage and millennial probability claims
        run: python -m src.long_horizon_uncertainty_audit
      - name: Quantify out-of-sample skill and disclose failed components
        run: python -m src.scientific_skill_gate
      - name: Import ERA5-derived annual global precipitation with provenance
        run: python -m src.era5_precipitation_import
      - name: Fit temperature precipitation and land-use sink drivers when data available
        run: python -m src.joint_sink_drivers
      - name: Enforce operational scientific evidence readiness gate
        run: python src/operational_readiness.py
      - name: Audit whether thousand-year scientific forecast claims are justified
        run: python src/millennium_claim_audit.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisector-worldbank-observations-and-coverage
          path: |
            data/multisector_*
            reports/multisector_*
            reports/calibration_*
            reports/historical_calibration_*
            reports/cross_sector_relationships.json
            reports/physical_validation_audit.json
            reports/bitcoin_cross_model_integration.json
            reports/bitcoin_primary_calibration.json
            reports/independent_source_evidence.json
            reports/independent_population_consistency.json
            reports/gcp_independent_target_calibration.json
            reports/operational_readiness.json
            reports/millennium_claim_audit.json
            reports/nasa_temperature_hindcast.json
            data/independent_raw/nasa_gistemp_global.csv
            reports/multibox_ensemble.json
            reports/noaa_gcp_carbon_hindcast.json
            reports/noaa_gcp_carbon_hindcast_rows.csv
            data/independent_raw/noaa_global_annual_co2.csv
            data/independent_raw/*
            data/bitcoin_*
          retention-days: 90
