name: Climate physical research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/climate_observation_acquire.py'
      - 'src/climate_free_running_forecast.py'
      - 'src/climate_aggi_physical_hindcast.py'
      - 'src/climate_igcc_full_forcing.py'
      - 'src/climate_joint_temperature_ocean.py'
      - 'src/hadcrut_independent_climate_test.py'
      - 'tests/test_hadcrut_independent_climate.py'
      - 'src/noaa_ocean_heat_import.py'
      - 'tests/test_climate_joint_temperature_ocean.py'
      - 'tests/test_climate_joint_observed_holdout_leakage.py'
      - 'tests/test_climate_igcc_full_forcing.py'
      - 'tests/test_climate_aggi_physics.py'
      - '.github/workflows/climate-physical-research.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scientific unit tests
        run: |
          python -m unittest discover -s tests -p test_climate_aggi_physics.py -v
          python -m unittest discover -s tests -p test_climate_free_running_forecast.py -v
          python -m unittest discover -s tests -p test_climate_igcc_full_forcing.py -v
          python -m unittest discover -s tests -p test_climate_joint_temperature_ocean.py -v
          python -m unittest discover -s tests -p test_hadcrut_independent_climate.py -v
      - name: NASA NOAA source ingestion
        run: python -m src.climate_observation_acquire
      - name: Physically dimensioned CO2 baseline
        run: python -m src.climate_free_running_forecast
      - name: NOAA AGGI greenhouse forcing experiment
        run: python -m src.climate_aggi_physical_hindcast
      - name: IPCC aligned aerosol solar and volcanic physical forcing benchmark
        run: python -m src.climate_igcc_full_forcing
      - name: Import NOAA ocean heat content and source provenance
        run: python -m src.noaa_ocean_heat_import
      - name: Joint physical NASA temperature and NOAA 0-2000m ocean heat validation
        run: python -m src.climate_joint_temperature_ocean
      - name: Independently compare physical prediction with Met Office HadCRUT5 current reference
        run: python -m src.hadcrut_independent_climate_test
      - name: Verify future NOAA ocean heat labels cannot influence model predictions
        run: python -m unittest discover -s tests -p test_climate_joint_observed_holdout_leakage.py -v
      - name: Publish raw observation and backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-physical-evidence
          path: |
            reports/climate_*json
            reports/hadcrut5_independent_climate_test.json
            data/independent_raw/noaa_aggi_annual_ghg_forcing.csv
            data/independent_raw/igcc_2024_annual_erf_best.csv
            data/independent_raw/ocean_heat_content_annual.csv
            data/independent_raw/hadcrut5_global_annual_v5200.csv
            reports/ocean_heat_content_provenance.json
            data/independent_raw/noaa_global_annual_co2.csv
            data/independent_raw/nasa_gistemp_global.csv
          if-no-files-found: warn
