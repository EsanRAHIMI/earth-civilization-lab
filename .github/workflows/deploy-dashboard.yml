name: Publish EarthLab Live Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_run:
    workflows: ['Six-sector observed validation']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: earthlab-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download validated model reports
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: observed-six-sector-validation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: web/model
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify dashboard
        run: |
          test -s web/index.html
          grep -q 'EARTH CIVILIZATION LAB' web/index.html
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
