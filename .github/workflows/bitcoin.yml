name: EarthLab real Bitcoin data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/bitcoin_data.py'
      - 'tests/test_bitcoin_data.py'
      - '.github/workflows/bitcoin.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All tests
        run: python -m unittest discover -s tests -v
      - name: Fetch real Bitcoin data
        run: python src/bitcoin_data.py --timespan 1year
      - name: Archive source and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-observed-data-audit-not-forecast
          path: |
            data/bitcoin_*
          retention-days: 90
